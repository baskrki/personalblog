<!-- The two fonts every page needs start loading right away. Only on a web server:
     when the page is opened straight from a folder, the browser refuses an early font request and
     just loads the fonts the normal way a moment later. -->
<script>
if (/^https?:$/.test(location.protocol)) {
  ["source-serif-4", "hanken-grotesk"].forEach(function (name) {
    var link = document.createElement("link");
    link.rel = "preload"; link.as = "font"; link.type = "font/woff2"; link.crossOrigin = "";
    link.href = "fonts/" + name + ".woff2";
    document.head.appendChild(link);
  });
}
</script>
